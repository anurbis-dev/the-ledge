<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>LEDGE v2</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#07060f;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    background:#07060f;box-shadow:0 0 0 2px #191428,0 14px 50px #000c}
  #dbg{position:fixed;left:8px;top:8px;font-size:9px;color:#7de0c0;text-shadow:0 1px 0 #000;
    display:none;pointer-events:none;white-space:pre;z-index:9}
  #stick{position:fixed;left:0;bottom:0;width:52%;height:62%;z-index:5;touch-action:none}
  #ring,#knob{position:fixed;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .12s;z-index:6}
  #ring{width:104px;height:104px;margin:-52px 0 0 -52px;border:2px solid #6a5fa855;background:#1a153055}
  #knob{width:44px;height:44px;margin:-22px 0 0 -22px;border:2px solid #9d8fe0aa;background:#3b3268cc}
  #acts{position:fixed;right:0;bottom:0;z-index:5;display:flex;gap:12px;align-items:flex-end;
    padding:0 calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) 0}
  .btn{width:74px;height:74px;border-radius:50%;border:2px solid #55487f;background:#1d1734cc;
    color:#e9e4ff;font-size:26px;display:flex;align-items:center;justify-content:center;touch-action:none}
  .btn.on{background:#4d3f86dd;transform:scale(.94)}
  .btn.act{width:60px;height:60px;font-size:21px;border-color:#7a5a3f;background:#241a2ecc}
  .btn.dn{width:60px;height:60px;font-size:20px;border-color:#4a5a7f;background:#1a2030cc}
  .btn.dn.on{background:#3a5080dd}
  .btn.act.on{background:#7a5330dd}
  #sys{position:fixed;right:8px;top:8px;display:flex;gap:6px;z-index:7}
  .mini{font-size:10px;color:#8f88bb;background:#160f28cc;border:1px solid #372c5e;border-radius:7px;padding:5px 8px}
  @media (pointer:fine){ #acts{opacity:.4} }
  #edbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:none;
    flex-direction:column;gap:4px;padding:6px calc(6px + env(safe-area-inset-right))
    calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));
    background:#0d0a18ee;border-top:2px solid #3a3460}
  #edbar.on{display:flex}
  .edrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  .edb{min-width:38px;height:30px;padding:0 6px;border-radius:7px;border:2px solid #4a4370;
    background:#1a152ecc;color:#e9e4ff;font-size:10px;letter-spacing:.04em}
  .edb.on{background:#4d3f86dd;border-color:#8f88bb}
  .edb.wide{min-width:78px}
  #edout{position:fixed;inset:6%;z-index:20;display:none;flex-direction:column;gap:6px;
    background:#0d0a18f2;border:2px solid #4a4370;border-radius:10px;padding:8px}
  #edout.on{display:flex}
  #edtext{flex:1;background:#150f26;color:#cfc6ff;border:1px solid #3a3460;border-radius:6px;
    font-family:ui-monospace,monospace;font-size:10px;padding:6px;resize:none}
  #menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;
    background:radial-gradient(circle at 50% 40%,#241a3d 0%,#0b0818 70%);
    padding:24px;text-align:center}
  #menu.hide{display:none}
  .mtitle{font-size:clamp(28px,9vw,52px);letter-spacing:.32em;color:#ffd9a0;
    text-shadow:0 3px 0 #7a4a2a,0 0 22px #ff9b3d66}
  .msub{font-size:11px;letter-spacing:.28em;color:#8f88bb;margin-bottom:6px}
  .mlist{display:flex;flex-direction:column;gap:7px;width:min(300px,84vw)}
  .mrow{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:10px;
    border:2px solid #4a4370;background:#1a152ecc;color:#e9e4ff;font-size:13px;
    letter-spacing:.08em;text-align:left}
  .mrow.lock{opacity:.42;border-color:#332c4d}
  .mrow.on:active{transform:scale(.97)}
  .mnum{width:22px;height:22px;border-radius:5px;background:#3b3268;color:#ffd9a0;
    display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
  .mrow.done .mnum{background:#3f7a4a;color:#d8ffd8}
  .mhint{font-size:9px;letter-spacing:.12em;color:#6a628f;margin-top:8px}
</style>

var SLR = 9, SLL = 10, RNDA = 11, RNDB = 12, WATER = 13, FALL = 14;
var base = new Uint8Array(MAP_W * MAP_H);
function resetMap(w, h){ MAP_W = w; MAP_H = h; base = new Uint8Array(w * h); }

function fillR(c, r, w, h, v){
  v = v === undefined ? ROCK : v;
  for (var y = r; y < r + h; y++)
    for (var x = c; x < c + w; x++)
      if (x >= 0 && y >= 0 && x < MAP_W && y < MAP_H) base[y * MAP_W + x] = v;
}
function slopeRun(c, r, n, dir, downTo){        // косой уступ с телом под ним
  for (var i = 0; i < n; i++){
    var cc = c + dir*i, rr = r - i;
    if (cc < 0 || cc >= MAP_W || rr < 0) continue;
    fillR(cc, rr, 1, 1, dir > 0 ? LADR : LADL);
    for (var k = rr + 1; k <= downTo; k++) fillR(cc, k, 1, 1, ROCK);
  }
}
function line(c, r, n, dc, dr, v){ for (var i = 0; i < n; i++) fillR(c + dc*i, r + dr*i, 1, 1, v); }

    fillR(23, 19, 9, 8);                 // пол лаза (верх = 304)
    fillR(32, 19, 4, 8);                 // выход из лаза

    /* --- камин: подъём отпрыгами по двум стенам --- */
    fillR(34, 12, 2, 5);                 // левая стена (низ 272 — проём для входа)
    fillR(39, 12, 2, 7);                 // правая стена
    fillR(36, 19, 3, 8);                 // дно камина 304
    fillR(41, 12, 7, 3);                 // площадка над камином (192)

    line(49, 6, 4, 0, 1, LADW);          // ряды 6..9, низ 160, верх 96
    fillR(50, 6, 7, 3);                  // площадка выхода (96)
    fillR(48, 12, 2, 3);                 // подпорка-ступень (192 -> прыжок к лестнице)

    /* --- фронтальная лестница вниз, в большой зал --- */
    line(57, 6, 16, 0, 1, LADF);         // ряды 6..21, низ ровно на полу зала 352
    fillR(50, 22, 23, 5);                // пол большого зала (352)

    slopeRun(60, 21, 7, 1, 21);          // косой подъём с телом под ним
    fillR(67, 15, 5, 2);                 // площадка выхода диагонали (240)

    /* --- шахта лифта №1: этажи 352 / 256 / 160, ширина = ширине кабины --- */
    fillR(72, 8, 1, 12);                 // левая стена (вход с этажа: ряды 20..21)
    fillR(76, 10, 1, 2);                 // правая: верхний этаж (160)
    fillR(76, 12, 1, 2);                 //         глухая стена
    fillR(76, 16, 1, 2);                 //         средний этаж (256)
    fillR(76, 18, 1, 2);                 //         глухая стена
    fillR(76, 22, 1, 5);                 //         нижний этаж (352)
    fillR(73, 23, 3, 4);                 // дно шахты на тайл ниже нижнего этажа
    fillR(77, 22, 10, 5);                // площадка нижнего этажа
    fillR(77, 16, 8, 2);                 // площадка среднего этажа
    fillR(77, 10, 6, 2);                 // площадка верхнего этажа
    fillR(83, 12, 1, 4);                 // стенка над средним этажом

    /* --- ямa с движущейся платформой: выбраться можно хватом за неё --- */
    fillR(87, 22, 4, 5);                 // край ямы слева
    fillR(95, 22, 9, 5);                 // край ямы справа (яма cols 91..94)

    line(91, 22, 5, 0, 1, LADF);         // лестница из ямы: упал — выберешься
    /* --- потолочные перекладины над ямой: переправа на руках --- */
    line(88, 18, 7, 1, 0, BAR);          // cols 88..94 над ямой
    /* --- узкая щель: только ползком (полупотолок = просвет 8px) --- */
    fillR(118, 18, 4, 1, HTOP);          // потолок-полутайл над рядом 19
    fillR(122, 15, 1, 1, ROCK);

    /* --- балкон с запертой дверью --- */
    fillR(96, 17, 8, 2);                 // балкон (272)
    line(104, 17, 5, 0, 1, LADW);        // ряды 17..21, низ 352 -> спуск с балкона
    fillR(104, 22, 12, 5);               // площадка под балконом

    /* --- ступени к финалу --- */
    fillR(116, 19, 6, 8);                // +2 тайла (304)
    fillR(122, 16, 6, 11);               // +3 тайла: хват кромки (256)
    fillR(128, 22, 10, 5);               // спуск (352)
    fillR(133, 16, 4, 1, CRUMB);         // осыпающийся карниз-бонус

    /* --- шахта лифта №2: этажи 352 / 208 --- */
    fillR(138, 12, 1, 8);                // левая стена (вход: ряды 20..21)
    fillR(142, 13, 1, 2);                // правая: верхний этаж (208)
    fillR(142, 15, 1, 5);                //         глухая стена
    fillR(142, 22, 1, 5);                //         нижний этаж (352)
    fillR(139, 23, 3, 4);                // дно шахты
    fillR(143, 22, 12, 5);               // площадка нижнего этажа
    fillR(143, 13, 7, 2);                // площадка верхнего этажа (208)

    /* --- верхний путь к выходу --- */
    fillR(150, 13, 4, 2);
    fillR(156, 16, 5, 2);                // ступень вниз (256)
    fillR(155, 22, 12, 5);               // земля перед финишем
    fillR(167, 22, 17, 5);               // финишная площадка

    /* ================= ПОДЗЕМЕЛЬЕ ================= */
    /* тоннель А: вход из двери */
    fillR(10, 40, 22, 6);                // пол тоннеля А (640)
    fillR(14, 36, 4, 1);                 // карниз
    line(20, 36, 4, 0, 1, LADW);         // ряды 36..39, низ 640, верх 576
    fillR(21, 36, 6, 2);                 // площадка наверху лестницы (576)
    fillR(27, 33, 4, 1);                 // карниз выше

    /* перемычка и тоннель Б */
    fillR(32, 42, 6, 4);                 // ступень вниз
    fillR(38, 40, 20, 6);                // пол тоннеля Б
    fillR(42, 35, 5, 2);                 // высокая полка
    fillR(50, 37, 4, 1);                 // карниз (хват)
    fillR(54, 33, 5, 2);

    /* лаз в подземелье: щель 16px */
    fillR(58, 31, 8, 8);                 // потолок лаза (низ 624)
    fillR(58, 40, 8, 6);                 // пол лаза (верх 640)

    /* тоннель В -> выходная дверь */
    fillR(66, 40, 20, 6);
    line(68, 36, 9, 1, 0, BAR);          // перекладины в тоннеле В
    fillR(70, 35, 5, 2);
    fillR(78, 33, 5, 2);
    line(84, 35, 5, 0, 1, LADW);         // ряды 35..39, низ 640, верх 560
    fillR(85, 35, 6, 2);                 // площадка (560)
    fillR(86, 40, 14, 6);                // пол у выходной двери

    /* тёмная комната — отдельным ярусом в толще породы */
    fillR(118, 42, 48, 30);              // массив камня вокруг яруса
    fillR(124, 58, 36, 3, E);            // полость комнаты
    fillR(124, 61, 36, 1);               // пол комнаты

    /* хранилище с палкой (за запертой дверью) */
    fillR(104, 40, 20, 6);
    fillR(108, 35, 5, 2);
    fillR(115, 33, 5, 2);
    fillR(120, 37, 3, 1, CRUMB);

  },

  build: function(){

function stepFliers(S, dt){

function mkItem(type){

}
function giveGear(S, type){

  if (!p.gear[it.slot]) p.gear[it.slot] = it;
  else p.spare.push(it);
  if (it.slot === 'weapon') p.stick = true;
  if (it.slot === 'helmet') p.helmet = true;
  if (it.slot === 'shield') p.shield = true;
  p.events.push('gear:' + type);
}
function wearGear(S, slot, n){
  var p = S.p, it = p.gear[slot];

  p.gear[slot] = null;                                  // сломалось — берём запасное
  for (var i = 0; i < p.spare.length; i++){
    if (p.spare[i].slot === slot){ p.gear[slot] = p.spare.splice(i, 1)[0]; break; }
  }
  if (slot === 'weapon') p.stick = !!p.gear.weapon;
  if (slot === 'helmet') p.helmet = !!p.gear.helmet;
  if (slot === 'shield') p.shield = !!p.gear.shield;
  p.events.push('broke:' + slot + (p.gear[slot] ? ':next' : ''));

}
function mkChests(){

function tryChest(S){

  for (var i = 0; i < S.chests.length; i++){
    var ch = S.chests[i];

    if (Math.abs((ch.x + 10) - cx) > 20 || Math.abs((ch.y - 6) - cy) > 22) continue;
    if (ch.locked && !S.keys){ p.events.push('chestlocked'); return true; }
    if (ch.locked){ ch.locked = false; S.keys--; }
    ch.opened = true; ch.t = 1.6;
    if (ch.kind === 'key'){ S.keys++; }

    else if (ch.kind === 'shield'){ giveGear(S, ['wshield','ishield','gshield'][ch.id % 3]); }
    else if (ch.kind === 'sword'){ giveGear(S, ch.id % 2 ? 'blade' : 'sword'); }
    else if (ch.kind === 'shroom'){ if (S.hp < 3) S.hp++; S.bag.shroom++; }
    else if (ch.kind === 'gem'){ S.bag.gem += 3; }
    else { S.bag.coin += 5; }

function dropLoot(S, x, y, tag){

  S.loot.push({ x:x, y:y, vx:(Math.random()-0.5)*50, vy:-110, kind:kind, t:12, got:false });

function stepLoot(S, dt){
  var p = S.p;
  for (var i = S.loot.length - 1; i >= 0; i--){
    var l = S.loot[i];
    l.t -= dt;
    if (l.t <= 0){ S.loot.splice(i, 1); continue; }
    if (!l.rest){
      l.vy += 620*dt; if (l.vy > 260) l.vy = 260;
      var nx2 = l.x + l.vx*dt;
      if (rectFree(nx2-3, l.y-3, 6, 6)) l.x = nx2; else l.vx *= -0.4;
      var ny2 = l.y + l.vy*dt;

    if (L.st === 'dwell'){                           // стоим: открыта только рабочая сторона
      if (p.x < L.x + 1 && !liftSideOpen(L, -1)){ p.x = L.x + 1; if (p.vx < 0) p.vx = 0; }
      if (p.x + p.w > L.x + L.w - 1 && !liftSideOpen(L, 1)){
        p.x = L.x + L.w - 1 - p.w; if (p.vx > 0) p.vx = 0;
      }
      continue;
    }
    if (p.x < L.x + 1){ p.x = L.x + 1; if (p.vx < 0) p.vx = 0; }
    if (p.x + p.w > L.x + L.w - 1){ p.x = L.x + L.w - 1 - p.w; if (p.vx > 0) p.vx = 0; }
  }
}
function mkPlats(){
  return LV.plats.map(function(a){
    return { x:a.x, y:a.y, w:a.w, h:a.h,
             x0:a.x0 !== undefined ? a.x0 : a.x, x1:a.x1 !== undefined ? a.x1 : a.x,
             y0:a.y0 !== undefined ? a.y0 : a.y, y1:a.y1 !== undefined ? a.y1 : a.y,
             v:a.v, dir:a.dir, dx:0, dy:0, vert: !!a.vert };
  });
}
function stepPlats(S, dt){
  for (var i = 0; i < S.plats.length; i++){
    var q = S.plats[i];
    if (q.vert){
      var ny = q.y + q.v * q.dir * dt;
      if (ny > q.y1){ ny = q.y1; q.dir = -1; }
      if (ny < q.y0){ ny = q.y0; q.dir = 1; }
      if (!rectFree(q.x, ny - 1, q.w, q.h + 1)){ ny = q.y; q.dir = -q.dir; }   // не вминаться в тайлы
      q.dy = ny - q.y; q.y = ny; q.dx = 0;
    } else {
      var nx = q.x + q.v * q.dir * dt;
      if (nx > q.x1){ nx = q.x1; q.dir = -1; }
      if (nx < q.x0){ nx = q.x0; q.dir = 1; }
      if (!rectFree(nx, q.y, q.w, q.h)){ nx = q.x; q.dir = -q.dir; }
      q.dx = nx - q.x; q.x = nx; q.dy = 0;
    }
  }
}
function platUnder(S, p, probeY){
  var i, q;
  for (i = 0; i < S.plats.length; i++){
    q = S.plats[i];
    if (p.x + p.w > q.x + 1 && p.x < q.x + q.w - 1 && probeY >= q.y - 1 && probeY <= q.y + q.h) return q;
  }
  for (i = 0; i < S.lifts.length; i++){
    var L = S.lifts[i];
    if (p.x + p.w > L.x + 1 && p.x < L.x + L.w - 1 && probeY >= L.y - 1 && probeY <= L.y + 8) return L;
  }
  return null;
}

/* ---------------- игрок ---------------- */
function mkPlayer(){
  var sx = LV.spawn.x, sy = LV.spawn.y;
  return {
    x: sx, y: sy, w: C.W, h: C.H, vx: 0, vy: 0, facing: 1,
    state: 'normal', onGround: true, jumping: false, sliding: 0,
    coyote: 0, buf: 0, grabCd: 0, lock: 0, landT: 0, rollT: 0, rollCd: 0, stunT: 0,
    apexY: sy, fell: 0, ride: null, hang: null, climb: null, lad: null,
    rollAng: 0, torch: -1, walking: false, warp: null,
    lastWall: 0, stick: false, helmet: false, shield: false, shieldCd: 0,
    gear: { weapon:null, shield:null, helmet:null }, spare: [], bashT: 0,
    atkT: 0, atkCd: 0, hurtCd: 0, snap: null,
    stance: 0, bars: null, ladCd: 0, inWater: false, wading: false,
    atSurface: false, swimSurf: null, swimAng: 0, wasWet: false, bubT: 0,
    air: C.AIR_MAX, swimLaunch: 0, stam: C.STAM_MAX, dashT: 0,
    events: []
  };
}
function resetPlayer(S){
  var had = S.p ? S.p.stick : false;
  var hadH = S.p ? S.p.helmet : false, hadS = S.p ? S.p.shield : false;
  var np = mkPlayer();
  np.x = S.respawn.x; np.y = S.respawn.y; np.apexY = np.y; np.onGround = true;
  np.stick = had; np.helmet = hadH; np.shield = hadS;
  if (S.p){ np.gear = S.p.gear; np.spare = S.p.spare; }
  S.p = np;
}

function moveX(S, p, dx){
  var oy = p.y;
  p.x += dx;
  if (!rectFree(p.x, p.y, p.w, p.h)){
    // ступенька в 1-3px (стыки склонов): подсаживаем, а не блокируем
    for (var k = 1; k <= 3; k++){
      if (rectFree(p.x, p.y - k, p.w, p.h)){ p.y -= k; return; }
    }
    p.y = oy;
    if (dx > 0) p.x = Math.floor((p.x + p.w) / T) * T - p.w;
    else        p.x = Math.floor(p.x / T) * T + T;
    p.vx = 0;
  }
}
function moveY(S, p, dy){
  var oldB = p.y + p.h;
  p.y += dy;
  if (!rectFree(p.x, p.y, p.w, p.h)){
    if (dy > 0){ p.y = Math.floor((p.y + p.h) / T) * T - p.h; p.onGround = true; }
    else        p.y = Math.floor(p.y / T) * T + T;
    p.vy = 0; p.ride = null;
    return;
  }
  if (dy > 0){                                  // односторонние движущиеся платформы
    for (var i = 0; i < S.plats.length; i++){
      var q = S.plats[i];
      if (p.x + p.w > q.x + 1 && p.x < q.x + q.w - 1 && oldB <= q.y + 1 && p.y + p.h >= q.y){
        p.y = q.y - p.h; p.vy = 0; p.onGround = true; p.ride = q; return;
      }
    }
  }
}
function groundAhead(S, p, dir){
  var px = dir > 0 ? p.x + p.w + 2 : p.x - 2, py = p.y + p.h + 3;
  if (solidAt(px, py)) return true;
  var probe = { x: dir > 0 ? p.x + 4 : p.x - 4, y: p.y, w: p.w, h: p.h };
  return !!platUnder(S, probe, py);
}
function ladderTopUnder(p, probeY){
  var c0 = Math.floor((p.x + 1)/T), c1 = Math.floor((p.x + p.w - 2)/T);
  for (var c = c0; c <= c1; c++){
    var r = Math.floor(probeY / T);
    if (ladderTop(c, r) && probeY >= r*T - 1 && probeY <= r*T + 7) return r*T;
  }
  return null;
}
function slopeUnder(p){
  // поверхность берём под центром — иначе на лесенке из скосов дёргает вверх
  var best = null, px;
  for (var i = 0; i <= 2; i++){
    px = p.x + 1 + (p.w - 2) * (i / 2);
    var c = Math.floor(px / T), r = Math.floor((p.y + p.h + 1) / T);
    for (var k = -1; k <= 1; k++){
      var v = tileAt(c, r + k);
      if (!isSlopeV(v)) continue;
      var sy = (r + k)*T + slopeTop(v, c, px);
      if (p.y + p.h >= sy - 12 && p.y + p.h <= sy + 20)   // допускаем шаг вверх по склону
        if (best === null || sy < best) best = sy;
    }
  }
  return best;
}
function grounded(S, p, noLadTop){
  if (slopeUnder(p) !== null) return true;
  if (!rectFree(p.x + 1, p.y + p.h, p.w - 2, 1)) return true;
  if (platUnder(S, p, p.y + p.h + 1)) return true;
  if (noLadTop) return false;
  return ladderTopUnder(p, p.y + p.h + 1) !== null;
}

function setH(p, h){ var b = p.y + p.h; p.h = h; p.y = b - h; }
function stanceH(st){ return st === 2 ? C.PRH : (st === 1 ? C.CRH : C.H); }
function stanceW(st){ return st === 2 ? C.PRW : C.W; }
function setStance(S, p, st){
  if (p.stance === st) return true;
  var h = stanceH(st), w = stanceW(st);
  var b = p.y + p.h, cx = p.x + p.w/2;
  var nx = cx - w/2, ny = b - h;
  if (!rectFree(nx, ny, w, h)) return false;           // не разогнуться / не растянуться
  p.x = nx; p.y = ny; p.w = w; p.h = h; p.stance = st;
  p.events.push(st === 0 ? 'stand' : (st === 1 ? 'crouch' : 'prone'));
  return true;
}

function hangBox(cx, cy, facing, kind){
  if (kind === 'lad') return { x: cx - C.W/2, y: cy - C.HAND };
  return { x: facing > 0 ? cx - C.W : cx, y: cy - C.HAND };
}
function standBox(cx, cy, facing){ return { x: cx + facing*C.STAND_OFF - C.W/2, y: cy - C.H }; }
function ladBox(cx, cy){ return { x: cx - C.W/2, y: cy - C.H }; }

function damage(S, n, stun){
  S.hp -= n; S.p.stunT = stun; S.p.state = 'stun'; S.p.vx = 0;
  S.shake = Math.min(7, 3 + n * 2); S.hitStop = 0.09;
  S.p.events.push('hurt');
  if (S.hp <= 0){ S.hp = 3; resetPlayer(S); S.p.events.push('respawn'); }
}

/* --- потолочные перекладины: движение на руках --- */
function barAt(px, py){ return isBarV(tileAt(Math.floor(px/T), Math.floor(py/T))); }
function tryBars(S, p){
  if (p.state !== 'normal' || p.onGround || p.vy < -40 || p.grabCd > 0) return false;
  var cx = p.x + p.w/2, handY = p.y + C.HAND;
  for (var dy = -8; dy <= 10; dy++){
    var py = handY + dy, r = Math.floor(py / T), c = Math.floor(cx / T);
    var vv = tileAt(c, r);
    if (vv === LADR || vv === LADL){                 // диагональ снизу — как перекладины
      var dgY = (r + 1) * T;
      if (Math.abs(dgY - handY) > 10) continue;
      var dny = dgY - C.HAND;
      if (!rectFree(p.x, dny, p.w, p.h)) continue;
      p.y = dny; p.vx = 0; p.vy = 0; p.onGround = false;
      p.state = 'bars';
      p.bars = { row: r, ph: 0, diag: (vv === LADR ? 1 : -1), col: c,
                 ax: p.x, ay: dny };                  // якорь для непрерывного наклона
      if (p.torch >= 0) dropTorch(S, false);
      p.events.push('grabbar');
      return true;
    }
    if (!isBarV(vv)) continue;
    var barY = (r + 1) * T;                       // низ перекладины — где висят руки
    if (Math.abs(barY - handY) > 9) continue;
    var ny = barY - C.HAND;
    if (!rectFree(p.x, ny, p.w, p.h)) continue;
    p.y = ny; p.vx = 0; p.vy = 0; p.onGround = false;
    p.state = 'bars'; p.bars = { row: r, ph: 0 };
    if (p.torch >= 0) dropTorch(S, false);
    p.events.push('grabbar');
    return true;
  }
  return false;
}
function updateBars(S, p, dt, inp){
  var B = p.bars;
  if (inp.jumpPressed || inp.downPressed){
    p.state = 'normal'; p.bars = null; p.vy = inp.jumpPressed ? C.JUMP*0.72 : 10;
    p.vx = inp.x * 70; p.apexY = p.y; p.grabCd = C.GRAB_CD;
    p.events.push(inp.jumpPressed ? 'jump' : 'release');
    return;
  }
  p.vy = 0;
  var dir = Math.abs(inp.x) > 0.35 ? (inp.x > 0 ? 1 : -1) : 0;
  if (dir && B.diag){                                 // вдоль наклонной лестницы
    p.facing = dir;
    var sp = C.BAR_V * 0.78 * dt;
    var nx2 = p.x + dir * sp;
    var ny2 = p.y - dir * B.diag * sp;                // вверх, если идём «в гору»
    // строго по прямой наклона: y считается от якоря, без привязки к сетке
    ny2 = B.ay - B.diag * (nx2 - B.ax);
    var cc2 = Math.floor((nx2 + p.w/2) / T);
    var rr2 = Math.floor((ny2 + C.HAND - 4) / T);
    var okTile = false;
    for (var rq = rr2 - 1; rq <= rr2 + 1; rq++){
      var vq = tileAt(cc2, rq);
      if (vq === LADR || vq === LADL){ okTile = true; break; }
    }
    if (okTile && rectFree(nx2, ny2, p.w, p.h)){
      p.x = nx2; p.y = ny2; B.row = rr2; B.col = cc2; B.ph += sp * 0.14;
    } else {
      p.state = 'normal'; p.bars = null; p.vy = 12; p.apexY = p.y;
      p.grabCd = C.GRAB_CD; p.events.push('release');
    }
    return;
  }
  if (dir){
    p.facing = dir;
    var nx = p.x + dir * C.BAR_V * dt;
    var ncx = nx + p.w/2;
    if (rectFree(nx, p.y, p.w, p.h) && barAt(ncx, B.row*T + 4)){
      p.x = nx; B.ph += C.BAR_V * dt * 0.12;
    } else if (!barAt(ncx, B.row*T + 4)){
      // конец перекладин — срываемся
      p.state = 'normal'; p.bars = null; p.vy = 12; p.apexY = p.y;
      p.grabCd = C.GRAB_CD; p.events.push('release');
    }
  }
}

/* --- автоцепляние за лестницу в падении --- */
function autoLadder(S, p, prevBottom){
  if (p.state !== 'normal' || p.vy <= 0 || p.lock > 0) return false;
  var cx = p.x + p.w/2;
  var c = Math.floor(cx / T);
  var r0 = Math.floor(prevBottom / T), r1 = Math.floor((p.y + p.h) / T);
  for (var r = r0; r <= r1; r++){
    for (var dc = 0; dc <= 1; dc++){
      var col = dc === 0 ? c : (cx - c*T > T/2 ? c + 1 : c - 1);
      var v = tileAt(col, r);
      if (!isLadV(v)) continue;
      var diag = (v === LADR || v === LADL);
      if (p.rollT > 0 && !diag) continue;              // в перекате ловит только диагональ
      // диагональ ловит всегда (она как настил), вертикальную — только на сходе с края
      if (!diag && p.vy > 190) continue;
      if (Math.abs(col*T + T/2 - cx) > 12) continue;
      var nx = diag ? p.x : col*T + T/2 - p.w/2;
      var ny = diag ? (r*T + T/2 - p.h/2) : p.y;
      if (!rectFree(nx, ny, p.w, p.h)) continue;
      if (p.rollT > 0){ p.rollT = 0; setStance(S, p, 0); }   // подкат прерывается
      p.x = nx; p.y = ny;
      attach(p, v, col, diag ? (col*T + T/2) - (nx + p.w/2) : 0,
                          diag ? (r*T + T/2) - (ny + p.h/2) : 0);
      p.lad.tc = col; p.lad.tr = r;
      return true;
    }
  }
  return false;
}

/* --- захват края / нижней перекладины --- */
function tryGrab(S, p){
  if (p.grabCd > 0 || p.onGround || p.state !== 'normal' || p.rollT > 0) return false;
  if (p.vy < C.GRAB_VY) return false;
  var handY = p.y + C.HAND, dir = p.facing, dy, py;

  var hx = dir > 0 ? p.x + p.w + 2 : p.x - 2;               // кромка уступа
  for (dy = -C.TOL_DN; dy <= C.TOL_UP; dy++){
    py = handY + dy;
    if (solidAt(hx, py) || !solidAt(hx, py + 2)) continue;
    var top = Math.floor((py + 2) / T) * T, wc = Math.floor(hx / T);
    var cx = dir > 0 ? wc * T : (wc + 1) * T;
    var hb = hangBox(cx, top, dir, 'ledge');
    if (!rectFree(hb.x, hb.y, p.w, p.h)) continue;
    var sb = standBox(cx, top, dir);
    if (!rectFree(sb.x, sb.y, p.w, p.h)) continue;
    grabTo(p, cx, top, dir, 'ledge', wc, Math.floor((py + 2) / T));
    return true;
  }
  for (var pi = 0; pi < W.plats.length; pi++){              // кромка движущейся платформы
    var q = W.plats[pi];
    var side = (p.x + p.w/2 < q.x + q.w/2) ? -1 : 1;
    if (side !== dir) continue;
    var cxq = side > 0 ? q.x + q.w : q.x;
    if (Math.abs((dir > 0 ? p.x + p.w : p.x) - cxq) > 12) continue;
    if (Math.abs(handY - q.y) > 9) continue;
    var hbq = hangBox(cxq, q.y, dir, 'ledge');
    if (!rectFree(hbq.x, hbq.y, p.w, p.h)) continue;
    grabTo(p, cxq, q.y, dir, 'ledge', -1, -1);
    p.hang.plat = q;
    return true;
  }
  var pcx = p.x + p.w/2, c0 = Math.floor(pcx / T);          // низ висячей лестницы
  for (var c = c0 - 1; c <= c0 + 1; c++){
    if (Math.abs(c * T + T/2 - pcx) > C.LAD_XTOL) continue;
    for (dy = -C.LAD_TOL; dy <= C.LAD_TOL; dy++){
      var r = Math.floor((handY + dy) / T);
      if (!ladderTile(c, r) || ladderTile(c, r + 1)) continue;
      var bot = (r + 1) * T;
      if (Math.abs(bot - handY) > C.LAD_TOL) continue;
      var lx = c * T + T/2;
      var lb = hangBox(lx, bot, dir, 'lad');
      if (!rectFree(lb.x, lb.y, p.w, p.h)) continue;
      var f = solidTile(c + 1, r) ? 1 : (solidTile(c - 1, r) ? -1 : p.facing);
      grabTo(p, lx, bot, f, 'lad', c, r);
      return true;
    }
  }
  return false;
}
function grabTo(p, cx, cy, facing, kind, tc, tr){
  if (p.torch >= 0 && W) dropTorch(W, false);
  if (p.stance !== 0 && W) setStance(W, p, 0);
  p.lastWall = 0;
  var b = hangBox(cx, cy, facing, kind === 'lad' ? 'lad' : 'ledge');
  p.x = b.x; p.y = b.y; p.vx = 0; p.vy = 0; p.facing = facing;
  p.state = 'hang'; p.onGround = false;
  p.hang = { cx: cx, cy: cy, kind: kind, tc: tc, tr: tr, lt: tileAt(tc, tr) };
  p.events.push('grab');
}

/* --- спуск спиной с края --- */
function tryDescend(S, p, want){
  var gy = Math.floor((p.y + p.h + 2) / T) * T;
  // если у края вплотную стоит лестница — кромка не работает, уходим на лестницу
  var lc0 = Math.floor((p.x + p.w/2) / T), lr0 = Math.floor((gy + 2) / T);
  if (ladderTile(lc0, lr0) || ladderTile(lc0 - 1, lr0) || ladderTile(lc0 + 1, lr0)) return false;
  var order = want ? [want, -want] : [p.facing, -p.facing];
  for (var i = 0; i < order.length; i++){
    var dir = order[i], col = -1;
    for (var d = 2; d <= 16; d += 2){
      var px = dir > 0 ? p.x + p.w - 1 + d : p.x - d;
      if (!solidAt(px, gy + 2)){ col = Math.floor(px / T) - dir; break; }
    }
    if (col < 0 || !solidTile(col, Math.floor((gy + 2) / T))) continue;
    var cx = dir > 0 ? (col + 1) * T : col * T, f = -dir;
    var hb = hangBox(cx, gy, f, 'ledge');
    if (!rectFree(hb.x, hb.y, p.w, p.h)) continue;
    startClimb(p, -1, cx, gy, f, 'ledge');
    return true;
  }
  return false;
}
function startClimb(p, dir, cx, cy, facing, kind){
  var from = { x: p.x, y: p.y }, to, ideal;
  if (dir > 0 && kind === 'lad'){ to = ladBox(cx, cy); ideal = hangBox(cx, cy, facing, 'lad'); }
  else if (dir > 0){ to = standBox(cx, cy, facing); ideal = hangBox(cx, cy, facing, 'ledge'); }
  else { to = hangBox(cx, cy, facing, 'ledge'); ideal = standBox(cx, cy, facing); }
  p.facing = facing; p.state = 'climb'; p.vx = 0; p.vy = 0; p.onGround = false;
  p.climb = { dir: dir, kind: kind, p: 0, dur: dir > 0 ? (kind === 'lad' ? C.TO_LAD : C.CLIMB_UP) : C.CLIMB_DN,
              cx: cx, cy: cy, facing: facing, from: from, to: to,
              off: { x: from.x - ideal.x, y: from.y - ideal.y } };
  p.events.push(dir > 0 ? 'climbup' : 'climbdown');
}
function releaseHang(p, push){
  p.state = 'normal'; p.hang = null; p.grabCd = C.GRAB_CD;
  p.vy = 12; p.onGround = false; p.apexY = p.y;
  if (push){ p.vx = push * 48; p.facing = push; }
  p.events.push('release');
}
function updateHang(S, p, dt, inp){
  p.vx = 0; p.vy = 0;
  if (p.hang.plat){                       // едем вместе с платформой
    var q = p.hang.plat;
    p.hang.cx += q.dx; p.hang.cy = q.y;
    p.x += q.dx; p.y = q.y - C.HAND;
  }
  var away = (inp.x !== 0 && inp.x !== p.facing) ? inp.x : 0;
  if (p.hang.kind === 'lad') away = 0;
  if (inp.jumpPressed){
    if (away){                                       // прыжок спиной от стены
      p.state = 'normal'; p.hang = null; p.grabCd = C.GRAB_CD;
      p.vx = away * C.WJ_X * 0.9; p.vy = C.WJ_Y; p.facing = away;
      p.lock = C.WJ_LOCK; p.apexY = p.y; p.events.push('backjump');
      return;
    }
    if (p.hang.kind === 'lad'){ startClimb(p, 1, p.hang.cx, p.hang.cy, p.facing, 'lad'); return; }
    if (rectFree(standBox(p.hang.cx, p.hang.cy, p.facing).x, standBox(p.hang.cx, p.hang.cy, p.facing).y, p.w, p.h)){
      startClimb(p, 1, p.hang.cx, p.hang.cy, p.facing, 'ledge'); return;
    }
  }
  if (inp.upPressed || inp.upHeld){
    if (p.hang.kind === 'lad'){ startClimb(p, 1, p.hang.cx, p.hang.cy, p.facing, 'lad'); return; }
    var sb = standBox(p.hang.cx, p.hang.cy, p.facing);
    if (rectFree(sb.x, sb.y, p.w, p.h)){ startClimb(p, 1, p.hang.cx, p.hang.cy, p.facing, 'ledge'); return; }
  }
  if (inp.downPressed){ releaseHang(p, 0); return; }
  if (away) releaseHang(p, away);
}
function ease(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2; }
function updateClimb(S, p, dt){
  var cl = p.climb;
  cl.p += dt / cl.dur;
  if (cl.p >= 1){
    p.x = cl.to.x; p.y = cl.to.y; p.vx = 0; p.vy = 0; p.apexY = p.y;
    if (cl.dir > 0 && cl.kind === 'lad'){
      var lc = Math.floor((p.x + p.w/2) / T);
      p.hang = null; p.climb = null;
      var lr = Math.floor((p.y + p.h/2) / T);
      attach(p, tileAt(lc, lr) || LADW, lc, 0, 0);
      p.lad.tc = lc; p.lad.tr = lr;
    } else if (cl.dir > 0){
      p.state = 'normal'; p.onGround = true; p.coyote = C.COYOTE; p.landT = 0.08;
      p.hang = null; p.climb = null; p.events.push('mantled');
    } else {
      p.state = 'hang'; p.hang = { cx: cl.cx, cy: cl.cy, kind: 'ledge',
        tc: Math.floor((cl.facing > 0 ? cl.cx : cl.cx - 1) / T), tr: Math.floor(cl.cy / T) };
      p.hang.lt = tileAt(p.hang.tc, p.hang.tr);
      p.climb = null; p.grabCd = 0; p.events.push('hanged');
    }
    return;
  }
  var t = ease(cl.p);
  p.x = cl.from.x + (cl.to.x - cl.from.x) * t;
  p.y = cl.from.y + (cl.to.y - cl.from.y) * t;
}

/* --- лестницы --- */
function ladKindAt(px, py){
  var v = tileAt(Math.floor(px/T), Math.floor(py/T));
  return isLadV(v) ? v : 0;
}
function railOf(p){ return { x: p.x + p.w/2 + p.lad.ox, y: p.y + p.h/2 + p.lad.oy }; }
function attach(p, kind, col, ox, oy){
  if (p.torch >= 0 && W) dropTorch(W, false);
  if (p.stance !== 0 && W) setStance(W, p, 0);   // на лестнице стоим в полный рост
  p.lastWall = 0;
  p.lad = { v: kind, col: col, dirx: kind === LADL ? -1 : 1, ph: 0, ox: ox, oy: oy,
            tc: col, tr: 0 };
  p.state = 'ladder'; p.vx = 0; p.vy = 0; p.onGround = false; p.ride = null;
  p.events.push('onladder');
}
function tryLadder(S, p, inp){
  if (p.rollT > 0 || (p.ladCd || 0) > 0) return false;
  var up = inp.upPressed || inp.upHeld, dn = inp.downPressed || inp.downHeld;
  if (!up && !dn) return false;
  var cx = p.x + p.w/2, probes = [];
  if (p.onGround){
    if (up) probes.push([cx, p.y + 8], [cx, p.y + p.h - 4], [cx, p.y + 3]);
    if (dn){
      probes.push([cx, p.y + p.h + 3]);
      probes.push([cx + p.facing*11, p.y + p.h + 2], [cx + p.facing*11, p.y + p.h - 2]);
      if (inp.x){ var sd = inp.x > 0 ? 1 : -1;
        probes.push([cx + sd*11, p.y + p.h + 2], [cx + sd*11, p.y + p.h - 2]); }
    }
  } else {
    probes.push([cx, p.y + 8], [cx, p.y + p.h - 4], [cx, p.y + 3]);
  }
  for (var i = 0; i < probes.length; i++){
    var px = probes[i][0], py = probes[i][1], k = ladKindAt(px, py);
    if (!k) continue;
    var col = Math.floor(px / T), diag = (k === LADR || k === LADL);
    var nx = diag ? p.x : col*T + T/2 - p.w/2;
    if (!rectFree(nx, p.y, p.w, p.h)) continue;
    var row = Math.floor(py / T), ox, oy;
    if (diag){ ox = (col*T + T/2) - (nx + p.w/2); oy = (row*T + T/2) - (p.y + p.h/2); }
    else { ox = 0; oy = py - (p.y + p.h/2); if (oy > 11) oy = 11; if (oy < -11) oy = -11; }
    if (!ladKindAt(nx + p.w/2 + ox, p.y + p.h/2 + oy)) continue;
    p.x = nx;
    attach(p, k, col, ox, oy);
    p.lad.tc = col; p.lad.tr = row;
    return true;
  }
  return false;
}
function exitTop(S, p, col, row, prefer){
  // встаём прямо на верхнюю перекладину — она держит как земля
  var ty = row*T - p.h, tx = p.x;
  if (ladderTop(col, row) && rectFree(tx, ty, p.w, p.h)){
    p.x = tx; p.y = ty; p.vx = 0; p.vy = 0;
    p.state = 'normal'; p.onGround = true; p.lad = null; p.snap = null;
    p.apexY = p.y; p.coyote = C.COYOTE; p.events.push('offladder');
    return true;
  }
  var sides = [prefer, -prefer], i, s;            // запасной вариант — на соседнюю площадку
  for (i = 0; i < 2; i++){
    s = sides[i];
    if (!solidTile(col + s, row)) continue;
    tx = (col + s)*T + T/2 - p.w/2; ty = row*T - p.h;
    if (!rectFree(tx, ty, p.w, p.h)) continue;
    p.snap = { fx: p.x, fy: p.y, tx: tx, ty: ty, p: 0, dur: C.LAD_SNAP };
    p.facing = s; p.state = 'snap'; p.lad = null; p.vx = 0; p.vy = 0;
    p.events.push('offladder');
    return true;
  }
  return false;
}
function updateLadder(S, p, dt, inp){
  var L = p.lad, diag = (L.v === LADR || L.v === LADL);
  if (inp.jumpPressed){
    p.state = 'normal'; p.lad = null; p.vy = C.JUMP * 0.84;
    p.vx = inp.x * 92; p.jumping = true; p.apexY = p.y;
    if (inp.x) p.facing = inp.x > 0 ? 1 : -1;
    p.events.push('jump'); return;
  }
  if (!diag && Math.abs(inp.x) > 0.6 && !inp.upHeld && !inp.downHeld){
    var sx = inp.x > 0 ? 1 : -1, tx = p.x + sx*3;
    if (rectFree(tx, p.y, p.w, p.h)){
      p.x = tx; p.state = 'normal'; p.lad = null; p.facing = sx;
      p.vx = sx*95; p.vy = -70; p.apexY = p.y; p.events.push('offladder');
      return;
    }
  }
  var up;
  if (diag){
    // по диагонали ходим влево-вправо: вправо-вверх для LADR, и наоборот
    var hx = Math.abs(inp.x) > 0.35 ? (inp.x > 0 ? 1 : -1) : 0;
    up = hx !== 0 ? hx * L.dirx : ((inp.upHeld ? 1 : 0) - (inp.downHeld ? 1 : 0));
  } else {
    up = (inp.upHeld ? 1 : 0) - (inp.downHeld ? 1 : 0);
  }
  if (up !== 0){
    var sp = C.LAD_V * dt, nx = p.x, ny = p.y;
    if (diag){ nx += L.dirx * up * sp * 0.72; ny -= up * sp * 0.72; }
    else ny -= up * sp;
    if (!rectFree(nx, ny, p.w, p.h)){
      if (up > 0) exitTop(S, p, L.tc, L.tr, diag ? L.dirx : (inp.x ? (inp.x > 0 ? 1 : -1) : p.facing));
    } else {
      var rx = nx + p.w/2 + L.ox, ry = ny + p.h/2 + L.oy;
      var move = false, drop = false;
      if (diag){
        var proj = ((rx - (L.tc*T + T/2)) * L.dirx + ((L.tr*T + T/2) - ry)) * 0.7071;
        move = true;
        if (proj > 11.3){
          if (ladderTile(L.tc + L.dirx, L.tr - 1)){ L.tc += L.dirx; L.tr -= 1; }
          else { move = false; exitTop(S, p, L.tc, L.tr, L.dirx); }
        } else if (proj < -11.3){
          if (ladderTile(L.tc - L.dirx, L.tr + 1)){ L.tc -= L.dirx; L.tr += 1; }
          else { move = false; drop = true; }
        }
      } else {
        L.tr = Math.floor(ry / T);
        if (ladKindAt(rx, ry)) move = true;
        else if (up > 0) exitTop(S, p, L.tc, Math.floor((p.y + p.h/2 + L.oy) / T),
                                 inp.x ? (inp.x > 0 ? 1 : -1) : p.facing);
        else drop = true;
      }
      if (move){ p.x = nx; p.y = ny; L.ph += sp * 0.17; }
      else if (drop){
        if (rectFree(nx, ny, p.w, p.h)){ p.x = nx; p.y = ny; }
        for (var sn = 1; sn <= 10; sn++){          // земля почти под ногами — просто встаём
          if (!rectFree(p.x + 1, p.y + p.h + sn, p.w - 2, 1)){ p.y += sn - 1; break; }
        }
        if (grounded(S, p) || !rectFree(p.x, p.y + 2, p.w, p.h)){
          p.y = Math.floor((p.y + p.h + 2)/T)*T - p.h;
          p.state = 'normal'; p.onGround = true; p.lad = null; p.apexY = p.y;
          p.coyote = C.COYOTE; p.events.push('offladder');
        } else {
          var bc = L.tc, br = L.tr;
          while (br > 0 && !ladderTile(bc, br)) br--;
          var f = solidTile(bc + 1, br) ? 1 : (solidTile(bc - 1, br) ? -1 : p.facing);
          p.lad = null; grabTo(p, bc*T + T/2, (br + 1)*T, f, 'lad', bc, br);
        }
      }
    }
  }
  if (p.state === 'ladder' && grounded(S, p, true) && up < 0){
    p.state = 'normal'; p.onGround = true; p.lad = null; p.apexY = p.y;
    p.coyote = C.COYOTE; p.events.push('offladder');
  }
}

/* --- осыпающиеся карнизы --- */
function touchCrumb(S, c, r){
  var k = r * MAP_W + c;
  if (tileAt(c, r) !== CRUMB) return;
  if (S.gone[k] > 0) return;
  if (S.crumbT === undefined) S.crumbT = {};
  if (S.crumbT[k] === undefined){ S.crumbT[k] = C.CRUMB_T; S.p.events.push('crack'); }
}
function stepCrumbs(S, dt){
  if (S.crumbT === undefined) S.crumbT = {};
  var k;
  for (k in S.crumbT){
    S.crumbT[k] -= dt;
    if (S.crumbT[k] <= 0){
      S.gone[k] = C.CRUMB_BACK; delete S.crumbT[k];
      S.shake = Math.max(S.shake, 3); S.p.events.push('crumble:' + k);
    }
  }
  for (k in S.gone){
    S.gone[k] -= dt;
    if (S.gone[k] <= 0) delete S.gone[k];
  }
}
function crumbCheck(S, p){
  var c, r;
  if (p.state === 'hang' && p.hang && tileAt(p.hang.tc, p.hang.tr) === CRUMB){
    touchCrumb(S, p.hang.tc, p.hang.tr);
    if (!solidTile(p.hang.tc, p.hang.tr)) releaseHang(p, 0);
  }
  if (p.onGround){
    r = Math.floor((p.y + p.h + 2) / T);
    for (c = Math.floor(p.x / T); c <= Math.floor((p.x + p.w - 1) / T); c++) touchCrumb(S, c, r);
  }
}

/* --- сбор --- */
function pickups(S, p){
  for (var i = 0; i < S.items.length; i++){
    var it = S.items[i];
    if (it.got) continue;
    if (Math.abs(it.x - (p.x + p.w/2)) < 11 && Math.abs(it.y - (p.y + p.h/2)) < 13){
      it.got = true; S.bag[it.kind]++;
      if (it.kind === 'shroom' && S.hp < 3) S.hp++;
  
      S.hitStop = Math.max(S.hitStop, it.kind === 'relic' ? 0.25 : 0.03);
      p.events.push('pick:' + it.kind + ':' + i);
    }
  }
}

/* --- основной шаг --- */
function step(S, dt, inp){
  W = S;
  S.p.events.length = 0;
  if (S.hitStop > 0){ S.hitStop -= dt; if (S.hitStop > 0) return; }
  S.t += dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 18);
  stepPlats(S, dt);
  stepLifts(S, dt);
  stepCrumbs(S, dt);
  stepTorches(S, dt);
  stepEnemies(S, dt);
  stepFliers(S, dt);
  stepSpiders(S, dt);
  stepDrops(S, dt);
  stepLoot(S, dt);
  if (S.p.hurtCd > 0) S.p.hurtCd -= dt;
  if (S.p.shieldCd > 0) S.p.shieldCd -= dt;
  if (S.p.bashT > 0) S.p.bashT -= dt;
  if (S.p.atkT > 0) S.p.atkT -= dt;
  if (S.p.atkCd > 0) S.p.atkCd -= dt;
  var pk = S.pick;
  if (!pk.key.taken && Math.abs(pk.key.x - (S.p.x + S.p.w/2)) < 12 &&
      Math.abs(pk.key.y - (S.p.y + S.p.h/2)) < 14){
    pk.key.taken = true; S.keys++; S.p.events.push('getkey');
  }
  for (var li = 0; li < S.lifts.length; li++){
    var LL = S.lifts[li], PP = S.p;
    if (inLift(PP, LL) && LL.st === 'dwell'){
      if (inp.upPressed) LL.want = 1;
      else if (inp.downPressed) LL.want = -1;
    } else if (LL.st === 'dwell' && PP.onGround &&
               PP.x + PP.w > LL.x - 44 && PP.x < LL.x + LL.w + 44){
      // стоим на этаже у шахты — вызов кабины к себе
      for (var fi = 0; fi < LL.floors.length; fi++){
        if (Math.abs((PP.y + PP.h) - LL.floors[fi]) < 6 && LL.idx !== fi &&
            (inp.upPressed || inp.downPressed)){
          LL.idx = fi; LL.st = 'move'; LL.want = 0;
          PP.events.push('liftcall');
          break;
        }
      }
    }
  }
  if (inp.upPressed && (tryExit(S) || tryDoor(S))) { /* вверх: пещера или дверь */ }
  else if (inp.actPressed) tryAction(S);

  var p = S.p;
  if (p.grabCd > 0) p.grabCd = Math.max(0, p.grabCd - dt);
  if (p.ladCd > 0) p.ladCd = Math.max(0, p.ladCd - dt);
  if (p.rollCd > 0) p.rollCd = Math.max(0, p.rollCd - dt);
  if (p.landT > 0) p.landT = Math.max(0, p.landT - dt);
  if (p.lock > 0 && p.lock < 9) p.lock = Math.max(0, p.lock - dt);

  if (p.ride && p.onGround && p.state === 'normal'){
    if (p.ride.dx) moveX(S, p, p.ride.dx);
    if (p.ride.dy){
      p.y += p.ride.dy;
      if (!rectFree(p.x, p.y, p.w, p.h)){
        p.y -= p.ride.dy;
        if (p.ride.dy < 0) damage(S, 1, 0.3);        // зажало лифтом о потолок
      }
    }
  }

  if (p.state === 'stun'){
    p.stunT -= dt;
    p.vx = 0; p.vy += C.GRAV * dt; moveY(S, p, p.vy * dt);
    if (p.stunT <= 0){ p.state = 'normal'; p.apexY = p.y; }
    crumbCheck(S, p); pickups(S, p); return;
  }
  if (p.state === 'warp'){ updateWarp(S, p, dt); return; }
  if (p.state === 'bars'){ updateBars(S, p, dt, inp); pickups(S, p); return; }
  if (p.state === 'snap'){
    var sn = p.snap; sn.p += dt / sn.dur;
    if (sn.p >= 1){
      p.x = sn.tx; p.y = sn.ty; p.snap = null; p.state = 'normal';
      p.onGround = true; p.apexY = p.y; p.coyote = C.COYOTE; p.vx = 0; p.vy = 0;
    } else {
      var se = ease(sn.p);
      p.x = sn.fx + (sn.tx - sn.fx)*se; p.y = sn.fy + (sn.ty - sn.fy)*se;
    }
    pickups(S, p); return;
  }
  if (p.state === 'climb'){ updateClimb(S, p, dt); crumbCheck(S, p); pickups(S, p); return; }
  if (p.state === 'hang'){ updateHang(S, p, dt, inp); crumbCheck(S, p); pickups(S, p); return; }
  if (p.state === 'ladder'){ updateLadder(S, p, dt, inp); pickups(S, p); return; }

  /* --- normal / roll --- */
  var rolling = p.rollT > 0;
  p.walking = false;

  // ↓ переключает стойку: стоя -> присед -> лёжа; ↑ или прыжок поднимают
  var inCab = false;
  for (var lc2 = 0; lc2 < S.lifts.length; lc2++) if (inLift(p, S.lifts[lc2])) inCab = true;
  if (inCab && p.stance > 0) setStance(S, p, 0);
  var onLadTop = ladderTopUnder(p, p.y + p.h + 1) !== null;
  if (!rolling && p.onGround && !inCab && !onLadTop && !p.inWater){    // на верхушке лестницы ↓ — это спуск
    if (inp.downPressed && p.stance < 2 && Math.abs(p.vx) <= 58) setStance(S, p, p.stance + 1);
    else if (inp.downHeld && p.stance === 0 && Math.abs(p.vx) <= 58) setStance(S, p, 1);
    if ((inp.upPressed || inp.upHeld || inp.jumpPressed) && p.stance > 0){
      if (setStance(S, p, p.stance - 1)) { p.buf = 0; }   // удержание ↑ поднимает до стойки
    }
  }
  // под низким потолком встать нельзя — держим стойку
  if (p.stance > 0 && p.onGround && !inp.downHeld && !inp.downPressed){
    if (p.stance === 2 && rectFree(p.x, p.y + p.h - C.CRH, p.w, C.CRH) && inp.upHeld) setStance(S, p, 1);
  }
  if (p.stance > 0 && !p.onGround && rectFree(p.x, p.y + p.h - C.H, p.w, C.H)) setStance(S, p, 0);
  // страховка: габариты рассинхронились со стойкой (например, после переката под потолком).
  // проверяем не только над головой, но и с запасом по бокам — иначе можно «встать» внутри щели
  if (!rolling && p.h !== C.H){
    var fitStand = rectFree(p.x, p.y + p.h - C.H, p.w, C.H);
    var fitCrouch = rectFree(p.x, p.y + p.h - C.CRH, p.w, C.CRH);
    if (fitStand && p.stance === 0) setH(p, C.H);
    else if (!fitStand && fitCrouch && p.stance <= 1){ setH(p, C.CRH); p.stance = 1; }
    else if (!fitStand && !fitCrouch && p.h > C.PRH){ setH(p, C.PRH); p.stance = 2; }
  }

  if (rolling && p.inWater){ p.rollT = 0; setStance(S, p, 0); rolling = false; }
  if (rolling){
    p.rollT -= dt;
    if (inp.x !== 0){ p.facing = inp.x > 0 ? 1 : -1; }
    p.vx = p.facing * C.ROLL_V * Math.max(0.55, p.rollT / C.ROLL_T + 0.25);
    p.rollAng += (p.vx * dt) / 7;
    var pushed = !rectFree(p.x + p.facing*3, p.y, p.w, p.h);
    if (p.rollT <= 0 && (inp.downHeld || inp.downPressed) && !pushed && Math.abs(p.vx) > 30){
      p.rollT = C.ROLL_T * 0.6;                    // продолжаем катиться, пока держат ↓
    }
    if (p.rollT <= 0){
      if (setStance(S, p, 0)) p.rollCd = C.ROLL_CD;
      else if (setStance(S, p, 1)) p.rollCd = C.ROLL_CD;
      else p.rollT = 0.1;
    }
  } else {
    var ax = p.lock > 0 ? 0 : inp.x;
    if (p.lock > 0){
      // после отпрыга ввод в стену игнорируется, трение не тормозит полёт
    } else if (ax !== 0){
      var slow = p.stance > 0;
      p.walking = slow;
      p.vx += ax * C.ACC * dt;
      var lim = p.inWater ? (p.dashT > 0 ? C.DASH_V : C.SWIM_V) : (p.wading ? C.WALK_V + 10 :
                (p.stance === 2 ? C.PRONE_V : (p.stance === 1 ? C.CROUCH_V : C.RUN)));
      lim *= Math.max(0.45, Math.abs(ax));
      if (p.vx > lim) p.vx = lim;
      if (p.vx < -lim) p.vx = -lim;
      p.facing = ax > 0 ? 1 : -1;
      if (p.stance > 0 && p.onGround && !groundAhead(S, p, p.facing)) p.vx = 0;
      if (!rectFree(p.x + p.facing*2, p.y, p.w, p.h) && slopeUnder(p) === null)
        p.vx = 0;                                 // упор в стену — не толкаемся (на склоне не мешаем)

    } else {
      var f = C.FRIC * dt;
      p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - (p.vx > 0 ? f : -f);
    }
  }

  if (inp.jumpPressed) p.buf = C.BUF;
  p.buf -= dt; p.coyote -= dt;

  var inCabin = false;
  for (var lj = 0; lj < S.lifts.length; lj++) if (inLift(p, S.lifts[lj])) inCabin = true;
  if (inCabin) p.buf = 0;                        // в кабине не прыгаем
  if (p.buf > 0 && p.coyote > 0 && !rolling && p.stance === 0){
    p.vy = C.JUMP; p.buf = 0; p.coyote = 0; p.onGround = false; p.jumping = true;
    p.grabCd = Math.max(p.grabCd, 0.25); p.ladCd = 0.3;
    p.apexY = p.y; p.events.push('jump');
  } else if (p.buf > 0 && p.sliding !== 0 && !p.onGround){    // прыжок от стены
    var same = (p.lastWall === p.sliding);
    p.vx = -p.sliding * (same ? C.WJ_SAME_X : C.WJ_X);
    p.vy = same ? C.WJ_SAME_Y : C.WJ_Y;                        // от той же стены — заметно слабее
    p.facing = -p.sliding;

/* --- кэш статичных тайлов чанками 8x8; осыпающиеся рисуем каждый кадр --- */
var CH = 8, PAD = 6, chunkCache = {};
function chunkOf(cx, cy){
  var key = cx + ',' + cy, ch = chunkCache[key];
  if (ch) return ch;
  var cv2 = document.createElement('canvas');
  cv2.width = CH*T + PAD*2; cv2.height = CH*T + PAD*2;
  var g2 = cv2.getContext('2d');
  g2.imageSmoothingEnabled = false;
  var saved = ctx; ctx = g2;                       // rc/lb пишут в чанк
  for (var r = cy*CH; r < (cy+1)*CH; r++){
    for (var c = cx*CH; c < (cx+1)*CH; c++){
      if (c < 0 || r < 0 || c >= G.MAP_W || r >= G.MAP_H) continue;
      var vv0 = G.tileAt(c, r);
      if (vv0 === G.CRUMB || vv0 === G.WATER || vv0 === G.FALL) continue;   // динамика — мимо кэша
      drawTile(c, r, (c - cx*CH)*T + PAD, (r - cy*CH)*T + PAD, false);
    }
  }
  ctx = saved;
  chunkCache[key] = cv2;
  return cv2;
}
function tiles(){
  var c0 = Math.max(0, ((cam.x/T)|0) - 1), c1 = Math.min(G.MAP_W-1, ((cam.x+VW)/T|0) + 1);
  var r0 = Math.max(0, ((cam.y/T)|0) - 1), r1 = Math.min(G.MAP_H-1, ((cam.y+VH)/T|0) + 1);
  var x0 = Math.floor(c0/CH), x1 = Math.floor(c1/CH);
  var y0 = Math.floor(r0/CH), y1 = Math.floor(r1/CH);
  for (var cy = y0; cy <= y1; cy++)
    for (var cx = x0; cx <= x1; cx++)
      ctx.drawImage(chunkOf(cx, cy), Math.round(cx*CH*T - cam.x) - PAD, Math.round(cy*CH*T - cam.y) - PAD);
  for (var r = r0; r <= r1; r++){
    for (var c = c0; c <= c1; c++){
      var vd = G.tileAt(c, r);
      if (vd === G.CRUMB || vd === G.WATER || vd === G.FALL)

function liftButtons(){

        if (G.isSolidV(G.tileAt(c, R - 1))) continue;      // тут нет проёма
        var side = si === 0 ? -1 : 1;

function boxPose(p){
  if (p.inWater) return (Math.sin(animT*7) > 0) ? SWIM0 : SWIM1;   // одна поза, наклон задаётся поворотом
  if (p.state === 'bars') return (Math.sin(p.bars.ph*2.4) > 0) ? BARS0 : BARS1;
  if (p.stance === 2) return (Math.abs(p.vx) > 4 && Math.sin(animT*7) > 0) ? PRONE1 : PRONE0;
  if (p.stance === 1) return (Math.abs(p.vx) > 4 && Math.sin(animT*6) > 0) ? CROUCH_W : CROUCH;
  if (p.atkT > 0){
    var t = 1 - p.atkT / C.ATK_T;
    return t < 0.32 ? lerpPose(ATK0, ATK1, t/0.32) : lerpPose(ATK1, ATK2, (t-0.32)/0.68);
  }
  if (p.state === 'stun') return STUNP;
  if (p.rollT > 0) return ROLLP;
  if (p.state === 'ladder'){
    var moving = Math.abs(p.lad.ph - (p.lad.lastPh || 0)) > 0.0001;
    p.lad.lastPh = p.lad.ph;
    var f = moving ? (Math.sin(p.lad.ph*3.1) > 0) : true;
    if (p.lad.v === G.LADF) return f ? LADF0 : LADF1;
    if (p.lad.v === G.LADR || p.lad.v === G.LADL) return f ? LADD0 : LADD1;  // диагональ: наклон корпуса
    return f ? LADP0 : LADP1;
  }
  if (p.state === 'hang' && p.hang.kind === 'lad') return HANGL;
  if (p.state === 'climb' && p.climb.kind === 'lad')
    return lerpPose(HANGL, (p.lad && p.lad.v === G.LADF) ? LADF0 : LADP0, p.climb.p);
  if (!p.onGround){
    if (p.sliding) return SLIDEP;
    return p.vy < -40 ? JUMPP : (p.vy > 60 ? FALLP : lerpPose(JUMPP, FALLP, 0.5));
  }
  if (p.landT > 0) return LANDP;
  var pushing = Math.abs(p.vx) < 7 && !G.rectFree(p.x + p.facing*3, p.y, p.w, p.h);
  if (pushing) return IDLE_A;                       // упёрлась в стену — стоим
  if (Math.abs(p.vx) > 8) return RUN[(runPh|0) % 4];
  return (Math.sin(animT*2.6) > 0) ? IDLE_A : IDLE_B;
}
function lightDirAt(wx, wy){
  var bx = 0, by = -1, bd = 1e9, i, L = torchPts();
  for (i = 0; i < L.length; i++){
    var dx = L[i][0] - wx, dy = L[i][1] - wy, d = dx*dx+dy*dy;
    if (d < bd){ bd = d; bx = dx; by = dy; }
  }
  if (bd > 130*130) return [0,-1];
  var m = Math.sqrt(bd) || 1;
  return [bx/m, by/m];
}
function hero(){
  var p = S.p, i, k, pt = {}, frontal = (p.state === 'ladder' && p.lad.v === G.LADF) ||
      (p.state === 'hang' && p.hang.kind === 'lad' && G.tileAt(p.hang.tc, p.hang.tr) === G.LADF);
  var cxw = p.x + p.w/2, cyw = p.y + p.h/2;
  var ld = lightDirAt(cxw, cyw), rim = [Math.round(ld[0]), Math.round(ld[1])];
  if (rim[0] === 0 && rim[1] === 0) rim[1] = -1;
  var wag = tail.a;

  if (p.state === 'hang' && p.hang.kind === 'ledge' || p.state === 'climb' && p.climb.kind === 'ledge'){
    var cx, cy, facing, pose, ox = 0, oy = 0;
    if (p.state === 'hang'){
      cx = p.hang.cx; cy = p.hang.cy; facing = p.facing;
      pose = (Math.sin(time*2.2) > 0) ? HANG_A : HANG_B;
    } else {
      var cl = p.climb; cx = cl.cx; cy = cl.cy; facing = cl.facing;
      pose = climbPose(cl.dir > 0 ? cl.p : 1 - cl.p);
      var kk = Math.max(0, 1 - cl.p/0.25);
      if (cl.dir < 0){ ox = cl.off.x*kk; oy = cl.off.y*kk; }
    }
    for (i = 0; i < K.length; i++){ k = K[i];
      pt[k] = [cx + facing*pose[k][0] - cam.x + ox, cy + pose[k][1] - cam.y + oy]; }
    figure(pt, facing, wag, false, rim, null, p.stick, { helmet: p.helmet, shield: p.shield });
    return;
  }
  var pose2 = boxPose(p), rot = 0, cxs = 0, cys = 0;
  if (p.rollT > 0){ rot = p.rollAng; cxs = 5; cys = 11; }
  else if (p.inWater && Math.abs(p.swimAng) > 0.02){
    rot = p.swimAng * (p.facing > 0 ? 1 : -1);            // наклон корпуса по ходу плавания
    cxs = 5; cys = 6;
  }
  for (i = 0; i < K.length; i++){
    k = K[i];
    var lxp = (frontal || p.facing > 0) ? pose2[k][0] : (p.w - pose2[k][0]);
    var ly = pose2[k][1];
    if (rot){
      var dx = lxp - cxs, dy = ly - cys, cs = Math.cos(rot), sn = Math.sin(rot);
      lxp = cxs + dx*cs - dy*sn; ly = cys + dx*sn + dy*cs;
    }
    pt[k] = [Math.round(p.x) + lxp - cam.x, Math.round(p.y) + ly - cam.y];
  }
  var hs = null, onBack = false;
  if (p.stick){
    if (p.atkT > 0){
      var tt = 1 - p.atkT / C.ATK_T;
      var a0 = -2.1 + tt*3.5;                   // замах -> удар сверху вниз
      hs = { ang: p.facing > 0 ? a0 : Math.PI - a0,
           type: p.gear.weapon && p.gear.weapon.type };
    } else onBack = true;                       // иначе палка убрана за спину
  }
  figure(pt, p.facing, wag, frontal, rim, hs, onBack, {
    helmet: p.helmet, shield: p.shield,
    helmType: p.gear.helmet && p.gear.helmet.type,
    shieldType: p.gear.shield && p.gear.shield.type,
    weaponType: p.gear.weapon && p.gear.weapon.type,
    bash: p.bashT
  });
}

var WEEDS = [], FISH = [], hearts = [];
function buildWater(){
  WEEDS = []; FISH = [];
  var pools = {};                                     // группируем воду в водоёмы по колонкам
  for (var c = 0; c < G.MAP_W; c++){
    var top = -1, bot = -1;
    for (var r = 0; r < G.MAP_H; r++){
      if (G.tileAt(c, r) === G.WATER){ if (top < 0) top = r; bot = r; }
      else if (top >= 0 && r > bot + 1){ break; }
    }
    if (top >= 0){
      pools[c] = { top: top, bot: bot };
      var depth = (bot - top + 1);
      var n = depth > 3 ? 3 : (depth > 1 ? 2 : 1);
      for (var k = 0; k < n; k++){
        var h1 = ((c*7 + k*13) % 100) / 100;
        if (h1 < 0.32) continue;                      // не сплошным забором
        var len = 5 + h1 * depth * 10;                // глубже — длиннее
        WEEDS.push({ x: c*T + 2 + ((c*5 + k*7) % 12),
                     y: (bot + 1) * T,
                     len: len, w: 1 + ((c + k) % 3),
                     hue: (c + k) % 3, ph: ((c*17 + k*31) % 100) / 100 * 6.28,
                     sway: 0.5 + h1 });
      }
    }
  }
  // рыбы: разные размеры и глубины
  var cols = Object.keys(pools).map(Number);
  if (cols.length > 4){
    var c0 = cols[0], c1 = cols[cols.length - 1];
    var count = Math.min(9, Math.max(3, Math.floor(cols.length / 8)));
    for (var f = 0; f < count; f++){
      var pc = cols[(f * 7 + 3) % cols.length];
      var pool = pools[pc];
      var big = f % 3 === 2;
      FISH.push({
        x: pc*T, y: (pool.top + 1 + ((f*3) % Math.max(1, pool.bot - pool.top))) * T,
        x0: c0*T + 8, x1: (c1 + 1)*T - 8,
        big: big, w: big ? 13 : 7, h: big ? 7 : 4,
        v: (big ? 26 : 44) + (f % 3) * 7,
        dir: f % 2 ? -1 : 1, kind: f % 3,
        ph: f * 1.7, scare: 0, bite: 0
      });
    }
  }
}
function stepWater(dt){
  var p = S.p, pcx = p.x + p.w/2, pcy = p.y + p.h/2;
  for (var i = 0; i < FISH.length; i++){
    var f = FISH[i];
    var dx = pcx - f.x, dy = pcy - f.y;
    var near = Math.abs(dx) < 60 && Math.abs(dy) < 34 && S.p.inWater;
    if (near && (!f.big || f.scare > 0)){
      f.dir = dx > 0 ? -1 : 1;                        // мелочь и напуганные уплывают
      f.scare = Math.max(f.scare - dt, 0);
      f.x += f.dir * f.v * 1.8 * dt;
    } else if (near && f.big){
      f.dir = dx > 0 ? 1 : -1;                        // крупные подплывают и кусают
      f.x += f.dir * f.v * 1.3 * dt;
      f.bite -= dt;
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && f.bite <= 0 && S.p.hurtCd <= 0){
        f.bite = 1.6; S.p.hurtCd = C.HURT_CD;
        S.hp -= 1; S.shake = Math.max(S.shake, 3);
        S.p.events.push('bite');
        if (S.hp <= 0){ S.hp = 3; G.resetPlayer(S); }
        f.scare = 1.2;
      }
    } else {
      f.x += f.dir * f.v * dt;
    }
    f.y += Math.sin(time * 1.6 + f.ph) * 6 * dt;

function edCell(clientX, clientY){
  var r = cv.getBoundingClientRect();
  var sx = (clientX - r.left) / r.width * VW;
  var sy = (clientY - r.top) / r.height * VH;
  return { c: Math.floor((sx + cam.x) / T), r: Math.floor((sy + cam.y) / T),
           x: sx + cam.x, y: sy + cam.y };
}
function edApply(cell){
  if (cell.c < 0 || cell.r < 0 || cell.c >= G.MAP_W || cell.r >= G.MAP_H) return;
  var key = cell.c + ':' + cell.r;
  if (ED.last === key && ED.tool !== 'pan') return;
  ED.last = key;
  if (ED.tool === 'tile'){
    G.setTile(cell.c, cell.r, ED_TILES[ED.pal][1]);
    chunkCache = {}; G.buildGates(S); buildWater();
  } else if (ED.tool === 'erase'){
    G.setTile(cell.c, cell.r, 0);
    edEraseObjects(cell);
    chunkCache = {}; G.buildGates(S); buildWater();
  } else if (ED.tool === 'obj'){
    edPlaceObject(cell);
  }
}
function edEraseObjects(cell){
  var near = function(ox, oy){ return Math.abs(ox - (cell.c*T + 8)) < 14 && Math.abs(oy - (cell.r*T + 8)) < 18; };
  S.enemies = S.enemies.filter(function(e){ return !near(e.x + e.w/2, e.y + e.h/2); });
  S.fliers  = S.fliers.filter(function(f){ return !near(f.x + f.w/2, f.y + f.h/2); });
  S.spiders = S.spiders.filter(function(s2){ return !near(s2.hx, s2.hy - 8); });
  S.torches = S.torches.filter(function(t){ return !near(t.x, t.y - 8); });
  S.chests  = S.chests.filter(function(c2){ return !near(c2.x + 10, c2.y - 6); });
  S.items   = S.items.filter(function(i2){ return !near(i2.x, i2.y); });
}
function edPlaceObject(cell){
  var kind = ED_OBJS[ED.pal][1];
  var cx = cell.c*T + 8, cy = cell.r*T + 8, floorY = (cell.r + 1)*T;
  if (kind.indexOf('enemy') === 0) G.mkEnemyAt(S, cx - 5, floorY, +kind.slice(5));
  else if (kind.indexOf('flier') === 0) G.mkFlierAt(S, cx - 6, cy - 4, +kind.slice(5));
  else if (kind.indexOf('spider') === 0) G.mkSpiderAt(S, cx, floorY, 0);
  else if (kind === 'torch') G.mkTorchAt(S, cx, floorY);
  else if (kind === 'chest') G.mkChestAt(S, cell.c*T, floorY, 'coin', false);
  else if (kind === 'chestL') G.mkChestAt(S, cell.c*T, floorY, 'gem', true);
  else G.mkItemAt(S, cx, cy, kind);
}
function edExportText(){
  var lv = G.levelSpec(), out = [];
  out.push('// ' + lv.name + ': геометрия (вставить в build())');
  var runs = [];
  for (var r = 0; r < G.MAP_H; r++){
    var c = 0;
    while (c < G.MAP_W){
      var v = G.tileAt(c, r);
      if (v === 0){ c++; continue; }
      var n = 1;
      while (c + n < G.MAP_W && G.tileAt(c + n, r) === v) n++;
      runs.push('fillR(' + c + ', ' + r + ', ' + n + ', 1, ' + v + ');');
      c += n;
    }
  }
  out.push(runs.join('\n'));
  out.push('');
  out.push('// объекты');
  out.push('enemies: [' + S.enemies.map(function(e){
    return '[' + Math.round(e.x) + ',' + Math.round(e.y + e.h) + ',' +
           Math.round(e.x0) + ',' + Math.round(e.x1) + ',' + Math.round(e.v) + ',' + e.kind + ']';
  }).join(',') + '],');
  out.push('fliers: [' + S.fliers.map(function(f){
    return '[' + Math.round(f.x) + ',' + Math.round(f.y) + ',' +
           Math.round(f.x0) + ',' + Math.round(f.x1) + ',' + Math.round(f.v) + ',' + f.kind + ']';
  }).join(',') + '],');
  out.push('spiders: [' + S.spiders.map(function(s2){
    return '[' + Math.floor(s2.hx / T) + ',' + (Math.floor(s2.hy / T) - 1) + ',' + s2.kind + ']';
  }).join(',') + '],');
  out.push('torches: [' + S.torches.map(function(t){
    return '[' + Math.floor(t.x / T) + ',' + (Math.floor(t.y / T) - 1) + ']';
  }).join(',') + '],');
  out.push('chests: [' + S.chests.map(function(c2){
    return '[' + Math.floor(c2.x / T) + ',' + (Math.floor(c2.y / T) - 1) + ",'" + c2.kind + "'," + !!c2.locked + ']';
  }).join(',') + '],');
  out.push('items: [' + S.items.map(function(i2){
    return '[' + Math.floor(i2.x / T) + ',' + Math.floor(i2.y / T) + ",'" + i2.kind + "']";
  }).join(',') + ']');
  return out.join('\n');
}
function edDrawOverlay(){
  var c0 = Math.max(0, (cam.x/T|0)), c1 = Math.min(G.MAP_W-1, ((cam.x+VW)/T|0));
  var r0 = Math.max(0, (cam.y/T|0)), r1 = Math.min(G.MAP_H-1, ((cam.y+VH)/T|0));
  ctx.globalAlpha = 0.22;
  for (var c = c0; c <= c1 + 1; c++) rc(c*T - cam.x, 0, 1, VH, '#8f88bb');
  for (var r = r0; r <= r1 + 1; r++) rc(0, r*T - cam.y, VW, 1, '#8f88bb');
  ctx.globalAlpha = 1;
  if (ED.hover){
    var hx = ED.hover.c*T - cam.x, hy = ED.hover.r*T - cam.y;
    rc(hx, hy, T, 2, '#ffd9a0'); rc(hx, hy + T - 2, T, 2, '#ffd9a0');
    rc(hx, hy, 2, T, '#ffd9a0'); rc(hx + T - 2, hy, 2, T, '#ffd9a0');
  }
  rc(0, 0, VW, 9, '#0d0a18cc');
  var label = ED.tool === 'tile' ? ED_TILES[ED.pal][0] :
              (ED.tool === 'obj' ? ED_OBJS[ED.pal][0] : ED.tool);
  for (var i = 0; i < label.length && i < 14; i++)
    rc(3 + i*5, 3, 4, 4, ED.tool === 'erase' ? '#ff7a6a' : '#ffd9a0');
}

var held = { l:false, r:false, u:false, d:false, j:false, a:false };
var latch = { j:false, u:false, d:false, a:false };
var ax = 0, stick = { on:false, id:-1, bx:0, by:0, dx:0, dy:0, up:false, dn:false, hx:0 };
var ringEl = document.getElementById('ring'), knobEl = document.getElementById('knob');
var DEAD = 15, MAXR = 46, VEN = 21, VEX = 13;

function place(el, x, y){ el.style.left = x + 'px'; el.style.top = y + 'px'; }
function stickReset(){
  stick.on = false; stick.id = -1; stick.dx = 0; stick.dy = 0;
  stick.up = false; stick.dn = false; stick.hx = 0; ax = 0;
  ringEl.style.opacity = 0; knobEl.style.opacity = 0;
}
function stickCalc(){
  var dx = stick.dx, dy = stick.dy, m = Math.sqrt(dx*dx + dy*dy);
  if (m > MAXR){ dx *= MAXR/m; dy *= MAXR/m; m = MAXR; }
  place(knobEl, stick.bx + dx, stick.by + dy);
  var adx = Math.abs(dx), ady = Math.abs(dy);
  var hOn = stick.hx !== 0 ? adx > DEAD*0.6 : adx > DEAD;          // гистерезис по горизонтали
  if (hOn){
    stick.hx = dx > 0 ? 1 : -1;
    ax = stick.hx * Math.min(1, Math.max(0.42, (adx - DEAD*0.6) / (MAXR - DEAD)));
  } else { stick.hx = 0; ax = 0; }
  stick.up = stick.up ? (dy < -VEX && ady > adx*0.32) : (dy < -VEN && ady > adx*0.5);
  stick.dn = stick.dn ? (dy >  VEX && ady > adx*0.32) : (dy >  VEN && ady > adx*0.5);
}
cv.addEventListener('pointerdown', function(e){
  if (!ED.on) return;
  e.preventDefault();
  var cell = edCell(e.clientX, e.clientY);
  if (ED.tool === 'pan'){
    ED.panId = e.pointerId; ED.panX = e.clientX; ED.panY = e.clientY;
    ED.camX = cam.x; ED.camY = cam.y;
  } else { ED.painting = true; ED.last = null; edApply(cell); }
  ED.hover = cell;
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});
cv.addEventListener('pointermove', function(e){
  if (!ED.on) return;
  var cell = edCell(e.clientX, e.clientY);
  ED.hover = cell;
  if (ED.tool === 'pan' && e.pointerId === ED.panId){
    var r = cv.getBoundingClientRect();
    cam.x = ED.camX - (e.clientX - ED.panX) / r.width * VW;
    cam.y = ED.camY - (e.clientY - ED.panY) / r.height * VH;
    cam.x = Math.max(0, Math.min(G.MAP_W*T - VW, cam.x));
    cam.y = Math.max(0, Math.min(G.MAP_H*T - VH, cam.y));
  } else if (ED.painting) edApply(cell);
});
function edUp(e){ ED.painting = false; ED.panId = -1; ED.last = null; }

cv.addEventListener('pointercancel', edUp);

var stEl = document.getElementById('stick');
stEl.addEventListener('pointerdown', function(e){
  e.preventDefault();
  if (stick.on) return;
  stick.on = true; stick.id = e.pointerId; stick.bx = e.clientX; stick.by = e.clientY;
  stick.dx = 0; stick.dy = 0;
  place(ringEl, stick.bx, stick.by); place(knobEl, stick.bx, stick.by);
  ringEl.style.opacity = 0.75; knobEl.style.opacity = 0.9;
  try{ stEl.setPointerCapture(e.pointerId); }catch(_){}
});
stEl.addEventListener('pointermove', function(e){
  if (!stick.on || e.pointerId !== stick.id) return;
  e.preventDefault();
  stick.dx = e.clientX - stick.bx; stick.dy = e.clientY - stick.by;
  var wasU = stick.up, wasD = stick.dn;
  stickCalc();
  if (stick.up && !wasU) latch.u = true;
  if (stick.dn && !wasD) latch.d = true;
});
function stickEnd(e){ if (e.pointerId === stick.id){ e.preventDefault(); stickReset(); } }
stEl.addEventListener('pointerup', stickEnd);

function jUp(e){ e.preventDefault(); held.j = false; bJ.classList.remove('on'); }

function kmap(e){
  var k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') return 'l';
  if (k === 'arrowright' || k === 'd') return 'r';
  if (k === 'arrowup' || k === 'w') return 'u';
  if (k === 'arrowdown' || k === 's') return 'd';
  if (k === ' ' || k === 'z' || k === 'x') return 'j';
  if (k === 'e' || k === 'f' || k === 'c') return 'a';
  return null;
}
addEventListener('keydown', function(e){
  if (e.key === 'r' || e.key === 'R'){ hardReset(); return; }
  if (e.key === 'h' || e.key === 'H'){ toggleDbg(); return; }
  var m = kmap(e); if (!m) return; e.preventDefault();
  if (!held[m] && (m === 'j' || m === 'u' || m === 'd' || m === 'a')) latch[m] = true;
  held[m] = true;
}, { passive:false });
addEventListener('keyup', function(e){
  var m = kmap(e); if (!m) return; e.preventDefault(); held[m] = false;
}, { passive:false });

function advanceScreens(){
  if (introT > 0){ introT = 0; return true; }
  if (outro && outro.t > 0.4){
    var nx = outro.next; outro = null;
    if (nx >= 0) startLevel(nx); else showMenu();
    return true;
  }
  if (paused){ paused = false; return true; }
  return false;
}

addEventListener('keydown', function(e){

});
function hardReset(){ S = G.mkWorld(G.levelIndex()); G.setWorld(S); parts.length = 0; flash = 0.6; }

/* ---------- прогресс и меню ---------- */
var PKEY = 'ledge.progress.v1';
function loadProgress(){
  try {
    var raw = localStorage.getItem(PKEY);
    if (raw){ var o = JSON.parse(raw); if (o && typeof o.max === 'number') return o; }
  } catch (e) {}
  return { max: 0, done: {} };            // max — индекс последнего открытого уровня
}
function saveProgress(){
  try { localStorage.setItem(PKEY, JSON.stringify(prog)); } catch (e) {}
}
var prog = loadProgress(), inMenu = true;
var paused = false, introT = 0, outroT = 0, outro = null;
var menuEl = document.getElementById('menu'), listEl = document.getElementById('mlist');

function buildMenu(){
  listEl.textContent = '';
  for (var i = 0; i < G.LEVELS.length; i++){
    (function(idx){
      var lv = G.LEVELS[idx];
      var open = idx <= prog.max;
      var row = document.createElement('div');
      row.className = 'mrow' + (open ? ' on' : ' lock') + (prog.done[idx] ? ' done' : '');
      var num = document.createElement('div');
      num.className = 'mnum'; num.textContent = prog.done[idx] ? '✓' : (idx + 1);
      var name = document.createElement('div');
      name.textContent = open ? lv.name : '— закрыто —';
      row.appendChild(num); row.appendChild(name);
      if (open) row.addEventListener('click', function(){ startLevel(idx); });
      listEl.appendChild(row);
    })(i);
  }
}
function showMenu(){
  inMenu = true; buildMenu();
  menuEl.classList.remove('hide');
}
function startLevel(idx){
  S = G.mkWorld(idx); G.setWorld(S);
  introT = 1;                                  // плашка с названием, игра ждёт касания
  paused = false; outro = null; outroT = 0;
  parts.length = 0; flash = 0.7; warpJump = true;
  cam.x = S.p.x - VW/2; cam.y = S.p.y - VH/2;
  applyPal(); buildWater();
  inMenu = false; menuEl.classList.add('hide');
}
function levelTotals(){
  var t = { coin:0, gem:0, shroom:0, chests:S.chests.length, chestsOpen:0, secrets:0, secretsFound:0 };
  for (var i = 0; i < S.items.length; i++){
    var it = S.items[i];
    if (t[it.kind] === undefined) t[it.kind] = 0;
    t[it.kind] += 1;
  }
  for (var j = 0; j < S.chests.length; j++) if (S.chests[j].opened) t.chestsOpen++;
  t.secrets = S.dark.length;
  for (var d = 0; d < S.dark.length; d++){
    var dz = S.dark[d];
    if (S.doors[dz.doorId] && !S.doors[dz.doorId].locked) t.secretsFound++;
  }
  return t;
}
function finishLevel(){
  var i = G.levelIndex();
  prog.done[i] = true;
  outro = { t: 0, totals: levelTotals(), bag: { coin:S.bag.coin, gem:S.bag.gem, shroom:S.bag.shroom },
            next: i + 1 < G.LEVELS.length ? i + 1 : -1 };
  if (i + 1 < G.LEVELS.length){
    prog.max = Math.max(prog.max, i + 1);
    saveProgress();
  } else {
    prog.max = Math.max(prog.max, i);
    saveProgress();
    showMenu();
  }
}
showMenu();
if (typeof window !== 'undefined'){                       // хуки для автотестов
  window.__state = function(){ return S; };
  window.__start = startLevel;
  window.__menu = function(){ return inMenu; };
  window.__skip = function(){ introT = 0; paused = false; outro = null; };
  window.__screens = function(){ return { intro: introT, paused: paused, outro: !!outro }; };
  window.__game = G;
  window.__editor = { open: edOpen, close: edClose, state: ED,
                      apply: function(c, r){ edApply({ c:c, r:r }); },
                      exportText: edExportText };
}
document.getElementById('bReset').addEventListener('click', hardReset);

/* ---------- масштаб ---------- */
function isFS(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFS(){
  var el = document.documentElement;
  if (!isFS()){
    var rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rq){ try { var r = rq.call(el); if (r && r.catch) r.catch(function(){}); } catch(_){} }
    if (screen.orientation && screen.orientation.lock){
      try { var l = screen.orientation.lock('landscape'); if (l && l.catch) l.catch(function(){}); } catch(_){}
    }
  } else {
    var ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex){ try { ex.call(document); } catch(_){} }
  }
  setTimeout(resize, 180);
}
function resize(){
  var land = innerWidth > innerHeight;
  var padB = land ? 4 : 150;
  var s = Math.min((innerWidth - (land ? 4 : 16))/VW, (innerHeight - padB)/VH);
  s = Math.max(0.55, s);
  cv.style.width = Math.floor(VW*s) + 'px';
  cv.style.height = Math.floor(VH*s) + 'px';
}
addEventListener('resize', function(){ resize(); });
addEventListener('orientationchange', function(){ setTimeout(resize, 160); });
resize();

/* ---------- цикл ---------- */
var acc = 0, last = performance.now(), STEP = 1/60;
var inp = { x:0, jumpHeld:false, jumpPressed:false, upHeld:false, upPressed:false, downHeld:false, downPressed:false, actPressed:false };
cam.x = S.p.x - VW/2; cam.y = S.p.y - VH/2;

function frame(now){
  var dt = Math.min(0.2, (now - last)/1000); last = now;
  acc += dt; time += dt; animT += dt;
  if (flash > 0) flash = Math.max(0, flash - dt*2.2);

  if (inMenu){ acc = 0; requestAnimationFrame(frame); return; }
  if (ED.on){
    acc = 0;
    ctx.clearRect(0, 0, VW, VH);
    sky(); tiles(); plats(); lifts(); caveExit(); doors(); chests();
    lootDrops(); items(); pickables(); drawTorches(); enemies(); spiders(); fliers();
    hero(); drawFish(); drawWeeds(); vignette();
    edDrawOverlay();
    requestAnimationFrame(frame);
    return;
  }
  if (S.done && !outro && S.p.warp && S.p.warp.exit && S.p.warp.moved){ finishLevel(); }
  if (introT > 0 || paused || outro){
    acc = 0;
    ctx.clearRect(0, 0, VW, VH);
    sky(); tiles(); plats(); lifts(); caveExit(); doors(); chests();
    lootDrops(); items(); pickables(); drawTorches(); enemies(); spiders(); fliers();
    hero(); drawFish(); lightPass(); drawWeeds(); fore(); vignette(); hud();
    if (introT > 0) drawIntro();
    else if (outro){ outro.t += dt; drawOutro(); }
    else drawPaused();
    requestAnimationFrame(frame);
    return;
  }

  var first = true;
  while (acc >= STEP){
    acc -= STEP;
    var kx = (held.r?1:0) - (held.l?1:0);
    inp.x = kx !== 0 ? kx : ax;
    inp.jumpHeld = held.j; inp.upHeld = held.u || stick.up; inp.downHeld = held.d || stick.dn;
    inp.jumpPressed = first && latch.j;
    inp.upPressed = first && latch.u;
    inp.downPressed = first && latch.d;
    inp.actPressed = first && latch.a;
    if (first){ latch.j = latch.u = latch.d = latch.a = false; first = false; }
    G.step(S, STEP, inp);
    for (var e = 0; e < S.p.events.length; e++){
      try { onEvent(S.p.events[e]); }
      catch (err){ if (typeof console !== 'undefined') console.warn('событие', S.p.events[e], err); }
    }
    var p = S.p;
    if (p.onGround && Math.abs(p.vx) > 8 && p.rollT <= 0) runPh += Math.abs(p.vx)*STEP*0.26;
    else if (p.state !== 'normal' || p.onGround) runPh = 0;
  }

  var p2 = S.p;
  var tgtLead = p2.facing * 20 * (Math.abs(p2.vx) > 30 ? 1 : 0.35);
  cam.lead += (tgtLead - cam.lead) * Math.min(1, dt*3.2);
  var wantLook = (inp.downHeld && p2.onGround && Math.abs(p2.vx) < 10 && p2.state === 'normal') ? 44 :
                 (inp.upHeld && p2.onGround && Math.abs(p2.vx) < 10 && p2.state === 'normal' ? -30 : 0);
  cam.look += (wantLook - cam.look) * Math.min(1, dt*2.2);
  var tx = p2.x + p2.w/2 - VW/2 + cam.lead;
  var ty = p2.y + p2.h/2 - VH/2 + cam.look;
  tx = Math.max(0, Math.min(G.MAP_W*T - VW, tx));
  ty = Math.max(0, Math.min(G.MAP_H*T - VH, ty));
  var kk = 1 - Math.pow(0.0015, dt);
  if (S.fade >= 0.95 || warpJump){ cam.x = tx; cam.y = ty; warpJump = false; }   // прыжок камеры под чёрным экраном
  else { cam.x += (tx - cam.x)*kk; cam.y += (ty - cam.y)*kk; }
  var shx = 0, shy = 0;
  if (S.shake > 0.05){ shx = (Math.random()-0.5)*S.shake*2; shy = (Math.random()-0.5)*S.shake*2; }
  var rcx = cam.x, rcy = cam.y;
  cam.x = Math.round(cam.x + shx); cam.y = Math.round(cam.y + shy);

  var tgtTail = -p2.vx*0.016 + (p2.state === 'ladder' ? 0 : Math.sin(time*5.5)*0.5) - (p2.vy < -80 ? 1.2 : 0);
  tail.v += (tgtTail - tail.a)*24*dt; tail.v *= 0.9; tail.a += tail.v*dt*7;
  if (tail.a > 3) tail.a = 3; if (tail.a < -3) tail.a = -3;

  stepWater(dt);
  var anyMoving = false;
  for (var lm = 0; lm < S.lifts.length; lm++) if (S.lifts[lm].st === 'move') anyMoving = true;
  liftSound(anyMoving);

  ctx.clearRect(0, 0, VW, VH);
  sky();
  tiles();
  plats();
  lifts();
  caveExit();
  doors();
  chests();
  lootDrops();
  items();
  pickables();
  drawTorches();
  enemies();
  spiders();
  fliers();
  hero();
  drawFish();
  drawParts(dt);
  drawHearts(dt);
  lightPass();
  drawWeeds();
  fore();
  vignette();
  if (S.fade > 0){
    ctx.globalAlpha = Math.min(1, S.fade);
    rc(0, 0, VW, VH, '#07060f');
    ctx.globalAlpha = 1;
  }
  hud();

  cam.x = rcx; cam.y = rcy;

  if (dbgOn){
    dbgEl.textContent = 'state ' + p2.state + ' face ' + p2.facing + ' hp ' + S.hp +
      '\nx ' + p2.x.toFixed(0) + ' y ' + p2.y.toFixed(0) + ' vy ' + p2.vy.toFixed(0) +
      '\nground ' + (p2.onGround?1:0) + ' slide ' + p2.sliding + ' roll ' + p2.rollT.toFixed(2) +
      '\nax ' + inp.x.toFixed(2) + ' up ' + (inp.upHeld?1:0) + ' dn ' + (inp.downHeld?1:0) +
      '\nfell ' + p2.fell.toFixed(0);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
