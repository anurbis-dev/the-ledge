<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>the LEDGE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%2307060f'/%3E%3Crect x='1' y='5' width='6' height='2' fill='%23ffd9a0'/%3E%3Crect x='5' y='3' width='2' height='2' fill='%23e0563c'/%3E%3C/svg%3E">
</head>
<body>
<div id="stage"><div id="view"><canvas id="c" width="320" height="180"></canvas><canvas id="h" width="320" height="180"></canvas></div></div>
<div id="splash">
  <canvas id="splashCv"></canvas>
  <div class="shint" id="splashHint">tap to continue</div>
</div>
<div id="menu" class="hide" data-screen="home">
  <canvas id="mEmbers" class="m-embers"></canvas>
  <div class="m-fg">
    <div class="mtitle"><span class="the">the</span>LEDGE</div>
    <div class="msub">caves and ledges</div>
    <div class="mpane" id="mHome"></div>
    <div class="mpane hide" id="mPath">
      <div class="mpane-head"><button type="button" class="mback" id="mPathBack">‹</button> PATH</div>
      <div class="mlist" id="mlist"></div>
    </div>
    <div class="mpane hide" id="mSettings">
      <div class="mpane-head"><button type="button" class="mback" id="mSetBack">‹</button> SETTINGS</div>
      <div class="mset" id="mSetList"></div>
    </div>
    <div class="mpane hide" id="mCredits">
      <div class="mpane-head"><button type="button" class="mback" id="mCredBack">‹</button> CREDITS</div>
      <div class="mcred">
        <p>the LEDGE</p>
        <p>caves and ledges</p>
        <p>a climb through dark stone</p>
      </div>
    </div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>
<div id="dbg"></div>
<div id="ring"></div><div id="knob"></div>
<div id="stick"></div>
<div id="acts"><div class="btn act" id="bA">✋</div><div class="btn" id="bJ">⤒</div></div>
<div id="edbar">
  <div class="ed-resize" id="edResize" title="Drag to resize"></div>
  <div class="ed-head">
    <div class="ed-tabs">
      <button type="button" class="ed-tab on" data-tab="tile">Tiles</button>
      <button type="button" class="ed-tab" data-tab="obj">Objects</button>
      <button type="button" class="ed-tab" data-tab="params">Params</button>
      <button type="button" class="ed-tab" data-tab="intro">Intro</button>
      <button type="button" class="ed-tab" data-tab="gear">Gear</button>
      <button type="button" class="ed-tab" data-tab="mix">Mix</button>
    </div>
    <div class="ed-head-acts">
      <button type="button" class="edb" id="edUndo" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button type="button" class="edb" id="edRedo" title="Redo (Ctrl+Y)" disabled>Redo</button>
      <button type="button" class="edb" id="edGeo" title="Toggle collision overlay (G)">Geo</button>
      <button type="button" class="edb" id="edCover" title="Paint room cover — tiles seen from outside. Alt+drag clones the map. Empty = hatch. RMB erases membership">Cover</button>
      <button type="button" class="edb" id="edColor" title="Recolor tiles in place (hue / sat / brightness / contrast). LMB paints current sliders, RMB clears, Ctrl+click picks">Color</button>
      <button type="button" class="edb" id="edNew">New Level</button>
      <button type="button" class="edb" id="edDel" title="Delete this level">Del Level</button>
      <button type="button" class="edb" id="edExport">Export</button>
      <button type="button" class="edb" id="edBake" title="Force-write levels, params, settings, mix and talk into src/core/defaults.js (dev server). Editor already autosaves levels/params.">Bake</button>
      <button type="button" class="edb" id="edClose">Close</button>
    </div>
  </div>
  <div class="ed-body">
    <div class="ed-pal" id="edPal"></div>
    <div class="ed-extra" id="edExtra"></div>
    <div class="ed-params" id="edParams" hidden>
      <div class="ed-param-bar">
        <input id="edParamQ" type="search" placeholder="Filter parameters…" autocomplete="off">
        <button type="button" class="edb" id="edParamReset">Reset</button>
      </div>
      <div id="edParamList"></div>
    </div>
    <div class="ed-params" id="edIntro" hidden></div>
    <div class="ed-params" id="edGear" hidden></div>
    <div class="ed-params" id="edMix" hidden></div>
  </div>
</div>
<div id="edLayers" class="ed-float" hidden>
  <div class="ed-float-head">
    <span>Layers</span>
    <div class="ed-head-acts">
      <button type="button" class="edb" id="edLayerAdd" title="Add layer">+</button>
      <button type="button" class="edb" id="edLayerDel" title="Delete layer">−</button>
    </div>
  </div>
  <div class="ed-float-body">
    <div id="edLayerList" class="layerlist"></div>
    <div id="edLayerProps"></div>
  </div>
</div>
<div id="edInspect" class="ed-float ed-inspect" hidden>
  <div class="ed-float-head">
    <span id="edInspectTitle">Object</span>
    <button type="button" class="edb" id="edInspectX">×</button>
  </div>
  <div id="edInspectBody" class="ed-float-body"></div>
</div>
<div id="edGhost" hidden></div>
<div id="edout"><textarea id="edtext" readonly></textarea><button class="mini" id="edOk">Close</button></div>
<div id="edVarMenu" class="ed-varmenu" hidden></div>
<div id="edChestAdd" class="ed-chestadd" hidden></div>
<div id="edChestList" class="ed-float ed-chestlist" hidden>
  <div class="ed-float-head">
    <span id="edChestListTitle">Chest</span>
    <button type="button" class="edb" id="edChestListX">×</button>
  </div>
  <div id="edChestListBody" class="ed-float-body"></div>
</div>
<div id="edNpcTalk" class="ed-float ed-npctalk" hidden>
  <div class="ed-float-head">
    <span id="edNpcTalkTitle">Dialogue</span>
    <button type="button" class="edb" id="edNpcTalkX">×</button>
  </div>
  <div id="edNpcTalkBody" class="ed-float-body"></div>
</div>
<div id="edBoulderSettings" class="ed-float" hidden>
  <div class="ed-float-head">
    <span>Boulder</span>
    <button type="button" class="edb" id="edBoulderSettingsX">×</button>
  </div>
  <div id="edBoulderSettingsBody" class="ed-float-body"></div>
</div>
<div id="edTileEdit" class="ed-float ed-tileedit" hidden>
  <div class="ed-float-head">
    <span id="edTileEditTitle">Tile</span>
    <button type="button" class="edb" id="edTileEditX">×</button>
  </div>
  <div id="edTileEditBody" class="ed-float-body"></div>
</div>
<div id="sys"><button class="mini" id="bEdit">Edit</button><button class="mini" id="bPause">Pause</button><button class="mini" id="bMenu">Menu</button><button class="mini" id="bFS">⛶ Full</button><button class="mini" id="bReset">Restart</button><button class="mini" id="bDbg">Debug</button></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
